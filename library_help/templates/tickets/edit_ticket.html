{% extends 'base.html' %}

{% block title %}Edit Ticket{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto mt-10 bg-white p-6 rounded-xl shadow">

    <h2 class="text-2xl font-bold mb-6 text-center">Edit Ticket</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}

        <!-- Title -->
        <div>
            <label class="block text-sm font-medium mb-1">Title</label>
            <input type="text"
                   name="title"
                   value="{{ ticket.title }}"
                   class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Description -->
        <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea name="description"
                      rows="4"
                      class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">{{ ticket.description }}</textarea>
        </div>

        <!-- Buttons -->
        <div class="flex justify-between items-center">

            <a href="/dashboard/"
               class="text-gray-600 hover:underline">
                ← Back
            </a>

            <button type="submit"
                    class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition">
                Update Ticket
            </button>

        </div>

    </form>

</div>

{% endblock %}
