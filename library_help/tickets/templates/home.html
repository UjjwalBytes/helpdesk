<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BytesHelpdesk</title>

    <!-- ✅ Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Container -->
    <div class="w-full max-w-2xl bg-white shadow-lg rounded-2xl p-6">

        <!-- Header -->
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            HelpingBytes
        </h1>

        <!-- Chat Box -->
        <div class="bg-gray-50 border rounded-xl p-4 h-64 overflow-y-auto mb-4" id="chatBox">
            <p class="text-gray-500">Ask your question below 👇</p>
        </div>

        <!-- Input Section -->
        <div class="flex flex-col sm:flex-row gap-2">

            <input 
                type="text" 
                id="query" 
                placeholder="Type your question..." 
                class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            >

            <button 
                onclick="sendQuery()" 
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition"
            >
                Ask
            </button>
        </div>

        <!-- Hidden CSRF -->
        <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

    </div>

<script>
function sendQuery() {
    let query = document.getElementById("query").value;
    let csrfToken = document.getElementById("csrf_token").value;
    let chatBox = document.getElementById("chatBox");

    if (!query.trim()) return;

    // ✅ Show user message
    chatBox.innerHTML += `
        <div class="text-right mb-2">
            <span class="inline-block bg-blue-500 text-white px-4 py-2 rounded-lg">
                ${query}
            </span>
        </div>
    `;

    fetch('/chatbot/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: 'query=' + encodeURIComponent(query)
    })
    .then(response => response.json())
    .then(data => {

        let responseHTML = `
            <div class="text-left mb-2">
                <span class="inline-block bg-gray-200 px-4 py-2 rounded-lg">
                    ${data.response}
                </span>
            </div>
        `;

        if (!data.found) {
            responseHTML += `
                <div class="text-left mb-2">
                    <a href="/login/" class="text-blue-600 underline">
                        Login to raise ticket
                    </a>
                </div>
            `;
        }

        chatBox.innerHTML += responseHTML;

        // Auto scroll
        chatBox.scrollTop = chatBox.scrollHeight;

        // Clear input
        document.getElementById("query").value = "";
    });
}

// ✅ Enter key support
document.getElementById("query").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendQuery();
    }
});
</script>

</body>
</html>
